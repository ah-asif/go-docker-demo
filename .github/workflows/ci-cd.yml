name: Go Docker CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ==========================================
  # 1. CI JOB: Run tests & verify Docker build
  # ==========================================
  test:
    name: Run Tests & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod' # Automatically uses the Go version defined in your go.mod
          cache: true

      - name: Run Go tests
        run: go test -v ./...

      - name: Verify Docker build
        run: docker build -t go-docker-demo:test .

  # ==========================================
  # 2. CD JOB: Deploy to VPS (Runs only if CI passes)
  # ==========================================
  deploy:
    name: Deploy to VPS
    needs: test # <--- Blocks deployment if 'test' fails
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' # <--- Only deploys on merge/push to main, not on PRs
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 100.64.0.31
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd /root/go-docker-demo

            git pull origin main
            docker build -t go-docker-demo .
            docker stop go-demo || true
            docker rm go-demo || true
            docker run -d \
              --name go-demo \
              -p 8080:8080 \
              --restart unless-stopped \
              go-docker-demo

            docker image prune -f